"MAIN|630":[["In this live coding session, Nuno Maduro walks you through building an AI agent, from the first prompt in the terminal all the way to a deployed app inside Slack.", "Along the way, we'll give the agent tools and sub-agents and deploy it to Laravel Cloud. Then, once it's live in Slack, we'll get into what it takes to run an agent for real: attachments, durable execution, steering conversations, scheduled tasks, and evals. Everything is built with Laravel's open-source Agent Stack. No experience building AI agents needed.", "Nuno Maduro is an open-source developer and the person behind Pest, Pint, and more. His projects have been downloaded more than two billion times."], [["Nuno Maduro", "Staff Software Engineer @ Laravel", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImI4OWNlN2IyLTBmZGMtNGE0ZS04NGNkLTk2ZDQ1Mjc4YWZjMSIsInB1ciI6ImJsb2JfaWQifX0=--9edf16a271090afe3252d1f521c48b581a65d591/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/maduro.webp", "https://www.linkedin.com/in/nunomaduro/"]]],

"MAIN|690":[["Most organizations have adopted AI. Far fewer can say what it actually changed. Using historical parallels and Bolt’s own experience, this talk explores where AI delivers real impact and why the biggest hurdle may not be the technology."], [["Siim Viidu", "VP of Engineering @ Bolt", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImM2YjM4ODllLTk0MjYtNDhhNS04NmM2LTllOTFkNjUwYTJmOSIsInB1ciI6ImJsb2JfaWQifX0=--40eb16821534fb2010a69c3389f375caf7c4766a/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/siim_viidu.webp", "https://www.linkedin.com/in/siimviidu/"]]],
"ENGINEERING|690":[["Theses:\n\n- what is object detection?\n\n- A brief history of computer vision and object detection models (basic convolutional layer logic, explanation of classic backbones, using features in 2-stage like RCNN or 1-stage YOLO v2 models)\n\n- Why transformer models took over the world? (transformers in LLMs, multi-head attention mechanism, ViT, DINO backbone)\n\n- DETR: it’s beaty and graceful implications (DETR, no expensive NMS, using object queries for specific tasks paired with detection like subclass or distance)\n\n- Can I run this on a microwave? (RF-DETR, optimizations that makes it a go to choice expect you are really limited in compute)"], [["Ihor Olkhovatyi", "Senior Applied Scientist @ SQUAD", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImE0YmFlOTkxLWMwMTEtNGM4NS1hNjAwLTY0YTRmODZlMWE1MSIsInB1ciI6ImJsb2JfaWQifX0=--43758ee59fb2925f019190c2b01cd9781558e84d/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/olkhovatyi.webp", "https://www.linkedin.com/in/ihor-olkhovatyi/"]]],
"STUDIO|690":[["Modern AI agents can do much more than generate code—they can continuously monitor, review, test, document, and improve your GitHub repositories. This session demonstrates how to build an autonomous team of AI agents that collaborates through GitHub workflows to reduce maintenance effort while keeping developers in control."], [["Taras Kloba", "Chief Partner Architect @ Microsoft", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjI2YTg3MWI1LTIyOWMtNDRmZS05NGVkLTMxZWI2ODI1Njk5OCIsInB1ciI6ImJsb2JfaWQifX0=--8ef688f2b9b2424c96d4e0591466c1d4a0541d2c/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/taras_kloba.webp", "https://www.linkedin.com/in/kloba/"]]],

"GROWTH|690":[["Can you trust an LLM with money? A convincing answer or a high click-through rate does not tell you whether a decision is good for business.", "Drawing on his experience with LLM-generated marketing content, Ruslan will explain why yesterday’s winning creatives can fail when market conditions change. He will explore how campaign results inform the system’s next decisions, what actually changes when it “learns from money,” and how financial metrics, spending limits, and observed results shape the scope of delegation.", "Attendees will gain a practical understanding of what it takes to move from generating content to choosing actions and allocating budgets, and what evidence is needed before trusting AI with those decisions."], [["Ruslan Turlakov", "CMO @ EPC Network", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjlhNzBmOGIzLWRjYmYtNDhjYi1iOGJiLWQzNmNjZjFlN2RmZSIsInB1ciI6ImJsb2JfaWQifX0=--83a1971e047a6e8737b4757cff9cf3336df40a6f/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/ruslan_turlakov-2.webp", "https://www.linkedin.com/in/ruslan-turlakov/"]]],
"MAIN|720":[["The next era of commerce will be defined by machines transacting with machines. AI agents will discover services, authorize spending, and settle payments without traditional checkout flows.", "This talk explores the infrastructure enabling that shift, from MPP and programmable payment mandates to agent identity and permission-based tokens. We’ll examine how autonomous systems can transact securely across organizational boundaries while preserving human control, enforcing spending policies, and maintaining auditable authorization.", "Attendees will leave with a practical understanding of agentic payments and what it takes to build a trusted machine-to-machine economy."], [["Ben Smith", "Staff developer advocate @ Stripe", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjM5NGJjZDRkLTkyMjktNDk0Ny1iYjU2LWQ4NmE2YjIyOWM4NyIsInB1ciI6ImJsb2JfaWQifX0=--ac463f62c34c7d2202b865d997e1f1946994616a/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/ben_smith.webp", "https://www.linkedin.com/in/benjasl/"]]],
"GROWTH|720":[["Growing an engineering team beyond 100 developers is a clear sign of success, but it also comes with new kinds of problems. The so-called 'Scaling Tax' starts to show through growing technical debt, slower delivery cycle, fragmented ownership of critical platform components, and a lack of systemic improvements. At this stage, to continue scaling effectively, organizations cannot simply hire their way out of this stagnation with more feature developers and need to invest not only in the product but in the systems, tools, and structures that support the people building it.\n\n\n\nThis talk shares the practices we’ve applied at Tide, where the mobile team exceeds 100 engineers, such as modular project structure, a dedicated platform team, solid automation, extensive onboarding, etc., to build a foundation that supports engineering at this scale."], [["Anna Leushchenko", "Senior Staff Engineer / Engineering Manager @ Tide", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImVjY2ZiMjM1LTNlZDEtNGM1MS1iYjI2LTc3NTU2NDAwOWRhYSIsInB1ciI6ImJsb2JfaWQifX0=--9c611421be41a38f432b122d48cf11ba4242e57e/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/anna_leuschenko.webp", "https://www.linkedin.com/in/annaleushchenko/"]]],
"ENGINEERING|720":[["Loops, skills, artifacts, factory. Let's skip the hype and take them apart on real, practical tasks - and not just those four. My running example is a personal AI assistant I spent the past year building. It isn't a chatbot. It's a task queue with a roster of agents that pick up work, do it, and report back. It now runs my life admin: booking my car service, hunting down rare vinyl, filing my sole-proprietor taxes, charting my apartment's power outages. I haven't done any of it by hand in months. This is the pragmatic, failures-included story of what those words mean once they stop being slideware and start paying rent - right down to this very talk description, which my assistant and I brainstormed and submitted together."], [["Yaroslav Yermilov", "Principal Software Engineer @ Preply", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjNhYTlmMzFhLTg2NTUtNDVkNy05YWQ4LTdiMmFjZTFjZmYxNSIsInB1ciI6ImJsb2JfaWQifX0=--0fe25af2334861c2998b5b775840464f6040650f/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/yaroslav_yermilov.webp", "https://www.linkedin.com/in/yarik-yermilov/"]]],
"MAIN|750":[["As a parent, I’ve often found that getting a straight answer from a teenager can feel like an exercise in debugging. This realisation led me to discover the surprisingly close parallels between navigating those conversations and understanding HTTP status codes. This talk won’t be about parenting (though there will be anecdotes!), but rather about decoding the language that modern systems use to communicate – success, failure, and everything in between. We’ll explore common HTTP status codes, their implications for developers, testers, architects, and anyone who works with data, and discover how these codes can help us troubleshoot problems, build more resilient applications, and perhaps even understand the often-mysterious responses we receive from the teenagers in our lives."], [["Hanno Embregts", "Java Champion, Oracle ACE Pro", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImU1OTk0YmY4LTUwYzctNDY3Ni1iMGM3LTA0Y2E0MDYzZjYyMSIsInB1ciI6ImJsb2JfaWQifX0=--6515ce4523057760e280d9eb84b475adf43d1457/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/hanno_embregts.webp", "https://www.linkedin.com/in/hannotify/"]]],
"GROWTH|750":[["Every engineer knows what technical debt costs. But while we've built entire disciplines around managing shortcuts in code (especially with AI as a helping hand), we're taking massive, unmeasured shortcuts in thinking – outsourcing analysis and often decision-making to AI before we've done the work ourselves.", "Hence, this talk introduces cognitive debt: what it is, why tech teams accumulate it faster than anyone, and how to keep AI's leverage without losing the ability to think first."], [["Michał Moneta", "Assistant Professor @ SWPS University", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImRiNmNhMGI1LTAwYmQtNGI3ZS04OWY0LTU3ZWRmYjJlOTYwMyIsInB1ciI6ImJsb2JfaWQifX0=--9f6902312487fab3205cb845723cd66c43992107/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/Micha%C5%82.png", "https://www.linkedin.com/in/michmoneta/"]]],

"MAIN|780":[["Globalne dane dotyczące wdrożeń AI pokazują, że w 95% organizacje ponoszą klęskę. Jak znaleźć się w tych 5%? Co musisz zrobić ty jako menedżer / zarząd a do czego przekonać swoich pracowników? Jakie nauki dotyczące AI można wyciągnąć obserwując wdrażania w fabrykach silnika elektrycznego w XIX wiecznej Anglii? Jak z sukcesem wdrażać AI w w swojej organizacji, co dokładnie trzeba posiadać i dlaczego to jest bardzo trudne (ale możliwe do zrobienia nawet od jutra)?"], [["Artur Kurasiński", "Entrepreneur, Author, Tech-realist", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImE2NjM2OGUxLTY5MDgtNDAwMy1hODhhLTVmMWRlYjM0YzRhZSIsInB1ciI6ImJsb2JfaWQifX0=--199390a190c11d5a546b5855d20bbe99f8654dda/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/artur_kurasinski.webp", "https://www.linkedin.com/in/artur-kurasinski/"]]],
"STUDIO|780":[["Fifteen years in sales and logistics, teachers who said maths was not my thing — and a maternity leave that became my way into IT. Today I work on computer vision in defence tech.\n\nIn this workshop a Raspberry Pi with an AI accelerator sits on stage and watches the room. It counts your raised hands and sorts them by type — then the same pipeline detects and classifies military targets. We'll look at several ways to collect data when nobody publishes it, and how a model trained on a big GPU is rebuilt to run on a tiny on-board computer. You leave with a free PDF roadmap into Embedded and CV."], [["Daria Chuprina", "CV / Embedded Engineer / AI Engineering @ Blue Bird Tech", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjQyYTVlYWI5LTE4ZjUtNGVkNi1hOGVhLTUzMGI1NzE2YjI1YyIsInB1ciI6ImJsb2JfaWQifX0=--a76a20ca765fb53338beb8df2e6dfb0ec675946f/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/daria_chuprina.webp", "https://www.linkedin.com/in/dchuprina/"]]],
"ENGINEERING|780":[["Our mission is short and bold: to change the way people eat - forever. To get there, we are rethinking how work gets done, with AI at its heart. But this talk is not another blueprint for a dark software factory. It’s a travelogue from HelloFresh’s journey to becoming AI-native: what works, what doesn’t, and what surprised us. We’ll stop at a few sights along the route: how we see where each team stands and what helps it next, an AI model router with budget control, agents at the gate between a change and production, evaluations that tell us whether a new model, memory, or tool is worth it, and the infrastructure that lets agents act on their own. Come along if you’ve ever wondered what it takes to bring a whole organisation on that journey."], [["Florian Stefan", "Principal Engineer @ HelloFresh", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjdkZDc0NDAxLTYzNjYtNDU5Yy05ZDlkLWFjYjQ0Y2U2NWFiYiIsInB1ciI6ImJsb2JfaWQifX0=--b1c57532809329d4a564b687f9f48070473ae10e/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/florian%201.png", "https://www.linkedin.com/in/florian-stefan-90553a109/"]]],

"ENGINEERING|810":[["Smart home devices used to sit still. The next generation drives, flies, and patrols - and the mobile app is no longer a remote control, it's a cockpit. When your app commands a machine moving through the physical world, everything changes: communication protocols, state management, failure modes, and how you test all of it.", "We'll dive into how mobile apps control robotic devices over WebRTC signalling, why real-time command protocols demand fail-safe design, and which scenarios are unique to robotics: mission interruptions, command conflicts, reconnection mid-flight, and safety-critical controls.", "You'll walk away with a practical understanding of the challenges robotics brings to mobile QA, and proven strategies for testing devices that move - manually and in automation."], [["Elnara Asadova", "QA Lead @ SQUAD", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjI0MjE0M2QxLWE2MDUtNGE4ZS04N2ViLWNjNjI3ZWE4Yzg4ZiIsInB1ciI6ImJsb2JfaWQifX0=--34d74e4acebbe4b6ef22545d214781a57d6db632/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/elnara_asadova.webp", "https://www.linkedin.com/in/elnara-asadova/"]]],

"STUDIO|870":[["In this workshop, I'll take a real robot arm through the full learning loop live on stage. First, you'll learn how to collect demonstrations on a real robot and record them to MCAP, an open log format built for multimodal robotics data. Then I'll review and curate the episodes in Foxglove, cut the bad takes, and show how to train a real policy with LeRobot. Finally, I'll deploy the policy on the arm and run it live.", "You'll learn how to:\n\nRecord synchronized camera, joint state, and action data to MCAP\n\nSpot and remove bad demonstrations before they reach training\n\nGo from a trained LeRobot policy to a running arm\n\nYou'll leave with access to the system that allows you to run the whole loop."], [["Mateusz Sadowski", "Robotics Developer Relations @ Foxglove", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6Ijg0YTIwYzA3LWE0ZmUtNDMzYy1hNWFmLWQyMzc5NDgxOTZlNyIsInB1ciI6ImJsb2JfaWQifX0=--c1af4d196a9995e455c50f87735b689b6755eda3/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/mateusz_sadowski.webp", "https://www.linkedin.com/in/mateuszsadowski/"]]],

"GROWTH|900":[["We released PostHog Self-driving right before the WAWTECH Summer: agents that go through your product data, spot problems and open pull requests for them. Since then 15,000+ companies have used it, and we’ve seen what works and what doesn’t. I’ll show how we built it and what we learned along the way. Bonus: I’ll ask you to break it live."], [["Alex Lebedev", "AI Product Engineer @ PostHog", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjVmMTViZTk4LTQ5NTEtNDM2NS05YTczLTljZWJlMzRhNThhOSIsInB1ciI6ImJsb2JfaWQifX0=--63c5536982b927118c801dfb50a65429cfd50a31/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/lebedev.webp", ""]]],
"ENGINEERING|900":[["Imagine two mission-critical systems exchanging sensitive data, when either system, or the network between them, could be compromised. We’ll build a secure integration architecture step by step, challenging common assumptions about trust, and introducing trust boundaries, identities, access control, data minimisation, encryption, and other security controls that limit blast radius.", "Using practical examples from defence technology, we’ll explore how layered architectural decisions help contain attacks, protect critical data, and keep systems operational even when individual security controls fail."], [["Anastasiia Voitova", "Head of Security Engineering @ Cossack Labs", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImEwNDg2ZTg5LWI3ZGEtNGVlNy04MjBjLWEyODExNWUxNDBiOSIsInB1ciI6ImJsb2JfaWQifX0=--5f82043d688c70a2fcbead7241c66b3d0be26895/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/anastasiia_voitova.webp", "https://www.linkedin.com/in/anastasiiavoitova/"]]],
"MAIN|930":[["The information war for the hearts and minds of the free world.", "In this keynote, data scientist, public speaker, and online writer Marijn Markus takes you to the invisible frontline of modern warfare. From disinformation and propaganda to OSINT, artificial intelligence, social media algorithms, and drone warfare, he reveals how technology, information, and good old-fashioned data have become weapons in a global struggle for influence and power.", "While the kinetic war is largely confined to Ukraine, with Russian drones increasingly violating the airspace of countries like Poland and Romania, another war is being fought everywhere, every day.", "An information war. A war waged by adversaries of the free world, designed to misinform us, divide us, overwhelm us, and ultimately confuse us so thoroughly that we can no longer distinguish fact from fiction, truth from lies, or friend from foe.", "Because when we no longer understand what is happening, we no longer know what to do.", "And when we don't know what to do, we do nothing. That is precisely how they win.", "Through real-world examples from the digital battlefield and the war in Ukraine, Marijn exposes the technologies, tactics, and strategies behind this invisible conflict, and explores how the same tools used to manipulate us can also help us fight back.", "This is a keynote about the invisible war being fought for the hearts, minds, and souls of the free world.", "Because the most dangerous battlefield is the one you don't even realize you're standing on."], [["Marijn Markus", "AI Lead, Managing Data Scientist @ Capgemini", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjJiNmYyN2ZkLTIyMzgtNGVlNi1hZTg2LTgxMTM2ZDYyMWFmMyIsInB1ciI6ImJsb2JfaWQifX0=--0904c737471bbde0542005faefaa2460b5c2f657/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/markus.w "GROWTH|930":[["Look at the Premier League table: Brighton is 2nd and Brentford is in the top half, while Manchester United, a club with several times their budget, sits 18th. Both clubs are owned by men who made their fortunes in professional betting syndicates: Tony Bloom (Starlizard) and Matthew Benham (Smartodds). They brought the same playbook from betting to football: better models, wider data, faster decisions.", "They built that playbook in a war most people never see. The usual story is “bookmakers fleece ordinary punters.” The real fight is between companies.", "Syndicates employ mathematicians, traders and engineers, often more of them than the bookmakers they bet against. They buy insider information before the market has it, bet through other people’s accounts, and use armies of bots to find bookmakers’ weak spots in pricing, live-betting delays, risk management and bonuses. Bookmakers fight back with real-time pricing models, tight latency control and AI that spots professional bettors.", "Yurii Kuka, Head of Business Operations at GR8_TECH, shows that front line from the bookmaker’s side, with real cases, a few goal clips and a lot of data."], [["Yurii Kuka", "Head of Business Operations @ GR8_TECH", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImY4ZWE5MjFiLTBmNTYtNGQ2YS1hNDliLTQ2Njk5NmI4NGVkNSIsInB1ciI6ImJsb2JfaWQifX0=--8fd2da7a1d074441b1d75c02d28ddd5d7b7e991d/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/yurii_kuka.webp", "https://www.linkedin.com/in/yura-kuka/"]]],
"MAIN|960":[["Back in the Artisenal era it took significant amounts of skill, time and\n\neffort to find security problems in software. With the rise of powerful AI\n\ntools used for this purpose, we have transitioned through a period with\n\naggressive halucinations into a time of high-volumne, high-quality security\n\nreports flooding all Open Source projects. High quality chaos.", "Based on his experiences in the curl project, one of the world's most widely\n\nused software components, Daniel describes the current reality, backed by\n\nreal-world numbers. The cold truth, viewed from one Open Source developer's\n\npoint of view.", "Biography:", "Daniel Stenberg is a Swedish Internet protocol expert and developer who has\n\nparticipated in and worked with Open Source for thirty years. Perhaps most\n\nknown for being the founder and lead developer of the curl project, one of the\n\nworld's most widely used software components. He participates in protocol\n\ndevelopment within the IETF and has authored books on curl, Open Source,\n\nHTTP/2, HTTP/3 and is a frequent public speaker. Daniel is the president of\n\nthe European Open Source Academy and a three times medal receiver for his Open\n\nSource work. Employed by wolfSSL."], [["Daniel Stenberg", "Creator of cURL @ cURL", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjI4NTY4ZWE5LThkM2EtNDJkZS1iZjQ0LWMyNmYxMzhjNjIzYSIsInB1ciI6ImJsb2JfaWQifX0=--68cd8a8b7b244012d5e6a23f1610a55ddfd74fb4/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/Daniel.webp", "https://www.linkedin.com/in/danielstenberg/"]]],
"GROWTH|960":[["Most product stories are told backward. Once a feature succeeds, it’s easy to believe the path was obvious all along.", "In reality, product teams work with competing hypotheses, incomplete evidence, and no clear playbook. The challenge isn’t finding the \"\"right\"\" answer—it’s making good decisions before anyone knows what the right answer is.", "In this talk, we’ll share real stories from building AI features at Superhuman: how we designed experiments, navigated disagreements, interpreted ambiguous data, and made decisions despite uncertainty.", "This isn’t a framework or a polished success story. It’s an honest look at what product development actually feels like while it’s happening, and what we’ve learned about making progress before the story makes sense in hindsight."], [["Sasha Marynych", "Engineering Manager @ Superhuman", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjE5YzVmM2ZlLTA1NzQtNGMzMy1hMmY5LWFkZWQ0OGI3ODViMSIsInB1ciI6ImJsb2JfaWQifX0=--7543cc69360eacc677c6fb7535f1642065384924/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/sasha_marynych.webp", "https://www.linkedin.com/in/sasha-marynych/"], ["Luisa Gonçalves", "Senior Product Manager @ Superhuman", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjkzYzJmZmYzLTcxODAtNGNkZi04YjhmLWFkMjA2NWM5YjgxZCIsInB1ciI6ImJsb2JfaWQifX0=--67a8e1c595a19072830fc9690b888e442f90d2ca/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/luisa_goncalves.webp", "https://www.linkedin.com/in/luisa-gon%C3%A7alves-02b90480/"]]],

"GROWTH|990":[["Arguing against a decision made above you rarely works, but showing a better solution that already runs does. I have faced this twice, once connecting a third-party system to a large existing content base, once inheriting an application that costs more to maintain than to rebuild. Both times a working alternative in Laravel Nova won the stakeholders over.", "This talk is about why that works: how Nova's conventions turn a data model into a usable admin panel in days, what to do when Nova reaches its limits, and why conventions, resource abstractions and AI assistance together make a working alternative faster to build than to debate. The examples are in Laravel and Nova; the approach applies to any stack with a convention-based framework and an admin layer."], [["Oleksandr Piekhota", "Principal Software Engineer @ Teaching Strategies, LLC", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImRlMjU0NThlLTNkNDAtNDc3Zi05MTk1LTQzMDZmMmY3MWNlNSIsInB1ciI6ImJsb2JfaWQifX0=--5b0b59c4e90c445d23dbb226b52eb59f6e52493d/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/oleksandr_piekhota.webp", "https://www.linkedin.com/in/oleksandr-piekhota-b675ba53/"]]],
