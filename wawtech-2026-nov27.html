"MAIN|570":[["How does the road to a fully autonomous future actually look? Waymo is the pioneer of autonomous driving technology. Join the Waymo talk to explore the evolution of the Waymo Driver from its early experimental days to a fully commercial, scaling ride-hailing service. Discover how advanced AI, cutting-edge sensor fusion, and millions of real-world miles are shaping the world's most experienced driver."], [["Monika Nawrot", "Staff Software Engineer & Manager @ Waymo", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImYxZWFhNjZlLWE0MTUtNGExOS1hZjgzLWUzYjIxNmUyMzBkMCIsInB1ciI6ImJsb2JfaWQifX0=--ebfdc3e8a9d1b66584d071ccd69d04e46655f271/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/monika_nawrot.webp", "https://www.linkedin.com/in/monikanawrot/"]]],
"ENGINEERING|570":[["How easy is it really to integrate OpenCV into a Java application? What about OpenVINO or any other C++ library? The answers may be less obvious than you expect.\n\nIn this talk, we will explore the challenges that arise when a Java application needs to use a high-performance or specialised library written in C++. At first glance, it may seem as simple as calling a function. In reality, the two languages follow fundamentally different models for memory, objects, error handling, and object lifecycles. We will examine where these difficulties come from, which approaches are genuinely safe, which only appear to be, and how to design a reliable bridge between the two worlds."], [["Denys Makogon", "Principal Software Development Engineer @ Oracle", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjNmZDk5Yjg2LTQwNDItNDg2MS1hZTViLWEwZmQ0NmY5ZDFhMCIsInB1ciI6ImJsb2JfaWQifX0=--b2390d81a645131f530d9034972a6b6961e0a837/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/%D0%92%D0%B8%D0%BB%D1%83%D1%87%D0%B5%D0%BD%D0%BE%20%D1%82%D0%BB%D0%BE%20%D1%83%20makogon.png", "https://www.linkedin.com/in/denys-makogon-45338150/"]]],
"GROWTH|570":[["5 years ago I tried building a computer game with zero coding experience, barely any cash and no real plan. Spoiler alert: it didn’t work out, but that crazy experiment ended up turning into a completely different business - hosting team building events for remote teams. In this talk, I’ll share how I validated my ideas, realized when to pivot and built a profitable company out of thin air."], [["Illia Onyschenko", "Founder & CEO @ Detectolic Games", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjE3OWY0NjFiLTA4ZGYtNDExZS05M2FiLWI0Mjc2YzA1N2UwOSIsInB1ciI6ImJsb2JfaWQifX0=--dbdcc64904f04f11b5460a9f2a2049d7a59bb2bc/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/illia_onyschenko.webp", "https://www.linkedin.com/in/illia-onyschenko-3436ba5/"]]],
"ENGINEERING|600":[["Spec-driven development promises that specs, not code, become the source of truth. A few months in, though, specs, code and tests quietly start to diverge. This talk maps the kinds of drift that appear once SDD meets a real project, explains why AI’s non-determinism makes them harder to spot, and shows practical ways to catch them early."], [["Mykhailo Ivanov", "Mobile Tech Lead @ mono", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImQ1ZjNmZTk1LTI4ZDMtNDkwMi05NzY5LTFmYTc5MmY4OGIwZiIsInB1ciI6ImJsb2JfaWQifX0=--4d65800f303a6ff02a018852d9575ae279daaafe/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/ivanov.webp", "https://www.linkedin.com/in/mykhivanov/"]]],

"STUDIO|600":[["Every AI demo this week will call somebody's API. This one calls a\n\ndatabase function.", "In 50 minutes you will build a working semantic search engine on your\n\nown laptop, on 12,656 real beers, where the embedding model runs inside\n\nPostgreSQL. No API key, no GPU, no cloud, no Python service. You type\n\n\"dark roasty coffee chocolate\" and get stouts back, in SQL!", "You will also see where it breaks: the approximate index that silently\n\nreturns zero rows and passes your tests, and the query that confidently\n\nrecommends kombucha with your kiełbasa. Then you will fix both.", "Bring a laptop with Docker installed and run one docker pull before you\n\narrive, or skip installing anything and use a free browser-based cloud\n\nshell. Everything else is one command and a psql prompt. No prior\n\nPostgreSQL or machine-learning experience needed."], [["Pavlo Golub", "Senior Developer @ CYBERTEC", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImE1NTQ5NDRjLWEwMWYtNGU0YS05YWEyLWVmZjMwNTM0YzAzZCIsInB1ciI6ImJsb2JfaWQifX0=--bc963a6626b5781d4a77684352c6a4e5d844624a/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/pavlo_golub.webp", "https://pashagolub.github.io/"]]],
"PRO STAGE|600":[[], [["Daniel Stenberg", "Creator of cURL @ cURL", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjI4NTY4ZWE5LThkM2EtNDJkZS1iZjQ0LWMyNmYxMzhjNjIzYSIsInB1ciI6ImJsb2JfaWQifX0=--68cd8a8b7b244012d5e6a23f1610a55ddfd74fb4/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/Daniel.webp", "https://www.linkedin.com/in/danielstenberg/"]]],

"ENGINEERING|630":[["This talk shares how my team at Autodesk used AI agents to automate one of the most repetitive parts of our workflow: fixing well-defined bugs in our design system. I'll walk through how the project evolved from an experiment into a practical engineering tool, the challenges we encountered, and the lessons we learned about applying AI to real-world software development."], [["Rafał Nowosielski", "Engineering Manager @ Autodesk", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjMzMGQ2ZDBkLWM2YWItNDFlNS04YThjLWM2YTE5ODk0YzJmNyIsInB1ciI6ImJsb2JfaWQifX0=--da42b7ad1255cef269db896abbb0e3a1ee3c70a6/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/rafal_nowosielski.webp", "https://www.linkedin.com/in/rafalnowosielski/"]]],
"GROWTH|630":[["Companies invest heavily in AI, automation, and hiring to make product teams faster. But what if the real bottleneck isn't execution — it's coordination?", "As teams grow, communication overhead, dependencies, and endless alignment meetings can slow down delivery more than we realize.", "In this talk, I'll share how I redesigned two cross-functional product teams into one, reduced coordination complexity, and distributed product thinking across the team."], [["Rostyslav Salata", "Head of Product (B2C) @ Jooble", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6Ijg5Yjk1M2EwLWMzODYtNDZiZC05N2ZmLWJiYzc1OWU1ZWM5OCIsInB1ciI6ImJsb2JfaWQifX0=--83477b886e702436d6698dd43829f34b67d1c704/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/salata.webp", "https://www.linkedin.com/in/rostyslav-salata/"]]],
"MAIN|660":[["Everyone is trying to get more out of their coding agents with better prompts, more guardrails, and cleverer loops, but the real bottleneck is upstream: what you feed the agent, and how you shape it for a memory that fills up and quietly forgets the middle. This talk is about the craft of turning what you know about your domain into context an agent can actually use, and about knowing when to hand it the reins and when to keep them. Get that right and the code follows; get it wrong, and no amount of clever prompting will save you."], [["Luca Mezzalira", "Software Architect, International Speaker, Author and Architecture Storyteller", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImVlZmJhNGNkLTA1MDUtNGUxMy04ZTA1LTM1ZGEwZDBmZGQ4OCIsInB1ciI6ImJsb2JfaWQifX0=--8b183befe0525c1db39482a06ada4351c3858568/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/luca_mezzalira.webp", "https://www.linkedin.com/in/lucamezzalira/"]]],

"ENGINEERING|660":[["At Saily, we've been actively working with coding agents for 10 months now through which we raised our engineering throughput 3 times. Hear how exactly we got to this point, what bottlenecks we've encountered and what comes next - at the point when increasing your speed further becomes damaging."], [["Ignas Paplauskas", "Head of Engineering @ Saily", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImE2NmIwMTg4LTdkMDMtNDg1MS1hMGRiLWU2Mjc0N2JlYTI1ZSIsInB1ciI6ImJsb2JfaWQifX0=--c3e549f076b5d0a71fd2529f623e60515d31ed69/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/ignas.webp", "https://www.linkedin.com/in/ignaspaplauskas/"]]],
"GROWTH|660":[["What if commanding a robot were as easy as talking to it? This talk presents the Agent 2 Robot Protocol (A2R) — a five-layer open-source architecture that turns natural speech in any language into safe robot actions, using local speech-to-text, an AI coding agent as the reasoning layer, and a deterministic CLI contract. Live demo included: a Unitree Go2 quadruped walks, turns, and dances on voice command — in simulation and on real hardware, switchable with a single flag."], [["Ivan Zhuravel", "Lead Software Engineer @ Cloudlinux", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjRiNTM0YzRmLWYwZTgtNGEyMS04YzVlLTkyYmQwOTY2YWYzOCIsInB1ciI6ImJsb2JfaWQifX0=--3ebe49098fbb50125ca84488f05aeef1ca464ce8/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/ivan_zhuravel.webp", "https://github.com/ivanguravel"]]],
"ENGINEERING|690":[["Your AI agent can write code in minutes. Your pull request can still wait until tomorrow. What happens when review becomes the slowest part of development? At Dropbox, we built an AI reviewer to shorten that wait, then faced the harder work of making its feedback worth reading. I'll share the design choices, mistakes, and rollout lessons behind that effort, with practical ideas for cutting review delays without flooding developers with noise."], [["Dmytro Kovalenko", "Staff Engineer @ Dropbox", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImMzMWRjMmU3LTY0NjAtNGI1OS04NWYxLTlmMjI2MzQ0ODdjMCIsInB1ciI6ImJsb2JfaWQifX0=--266f0c1f1f001cebf271ad46499d647600d7611a/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/dmytro_kovalenko.webp", "https://www.linkedin.com/in/dmytro-kovalenko-60643036/"]]],
"GROWTH|690":[["What it takes for one person to bring a product from zero to public launch with an AI agent as their only teammate. An honest case study of building SQL Guru — an AI-powered SQL trainer — solo with Claude Code: where AI is a real superpower, where it quietly fails you, and the road to actually shipping it."], [["Hanna Pylieva", "CEO @ Data Loves Academy", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjY2ZmQwMWUxLWFlNWMtNGIyYS05OGRiLWU1YmIxYjc2MjRhZSIsInB1ciI6ImJsb2JfaWQifX0=--dc39971ee326349490d5c629ae945a83d0c17815/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/hanna_pylieva.webp", "https://www.linkedin.com/in/hanna-pylieva/"]]],
"STUDIO|690":[["Your team's AI setup — skills, agents, plugins — is production infrastructure that everyone installs, and most teams change it with zero tests. One edited description silently stops a skill from triggering, and nobody notices for weeks.", "In 45 minutes we fix that on a real repo. You fork my prepared harness template, write your first basic evals for the skills and agents inside it, wire them into CI so the merge gate goes red when behavior breaks, then bump the version and ship it. Fast, practical, no theory: by the end you have a harness whose changes are tested, gated, and versioned — and a template you can point at your own repo the same week."], [["Ivan Lapa", "Senior UI Engineer, AI Engineering Consultant @ Netflix", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImQ1NjVlNTA1LWNhNzctNDA2Zi1iMWE1LWQ0OTI1NjI1ZGM4ZCIsInB1ciI6ImJsb2JfaWQifX0=--76d8194dfba09853b075ec0a9cc6e255898e068f/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/Lapa.png", "https://www.linkedin.com/in/ai-consult/"]]],

"ENGINEERING|720":[["As generative AI fuels a surge in hyper-realistic deepfakes, enterprise fraud, and coordinated cognitive warfare, traditional heavy detection models are proving too slow and costly to keep pace. This session explores how applied mathematics can be leveraged to build \"lightweight\" algorithms capable of identifying synthetic media in real time. Attendees will learn how these high-efficiency models are currently being deployed to protect live communication channels, banking KYC protocols, and national media ecosystems."], [["Florian Barbaro, PhD", "Founder & CEO @ Uncovai", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjJmZTI0YjU3LWYxOTUtNDAxYS1hN2Q4LWQ1YTM4MTcyM2MxMSIsInB1ciI6ImJsb2JfaWQifX0=--1c77bfc35f9a25e470a8cef0bdc39d3df0b3971e/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/florian_barbaro.webp", "https://www.linkedin.com/in/florian-barbaro-phd-090048b2/"]]],
"GROWTH|720":[["With more than 300 developers in Engineering, adopting AI at Namecheap is not just about giving developers access to new tools. It requires us to rethink how our engineering organization works and how we structure our processes.", "In this talk, I’ll share Namecheap’s journey of adopting AI across Engineering: where we started, why we saw an opportunity to fundamentally change the way we work, and what we are doing to make AI adoption effective at scale.", "I’ll talk about how we encourage and drive AI adoption, introduce AI into the engineering workflow, and move beyond individual productivity towards changing the processes themselves, from how developers work and review code to how tasks are executed with autonomous AI agents.", "I’ll share how we measure whether these changes are helping us move faster and more effectively, and what we are learning along the way.", "This is a practical look at what it takes to move from simply using AI to building an engineering organization that works differently because of it."], [["Julia Korytko, PhD", "Deputy Director of Engineering @ Namecheap, Inc", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjViNzFiOGU4LWUzNGQtNDQ4My04OGM3LTEyY2I3MjBkM2RmZCIsInB1ciI6ImJsb2JfaWQifX0=--0288b7252c52f85ef44c07e53b3f484892dbcb0e/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/julia_korytko.webp", "https://www.linkedin.com/in/juliakorytko/"]]],

"ENGINEERING|780":[["Concurrency is notoriously hard - for humans and agents alike. But it’s also ubiquitous.", "Structured concurrency is one technique that simplifies concurrent programs, known from Python & Kotlin - and now coming in full swing to Java. Thanks to its lexical nature, it’s also easy to master for AI coding agents.", "Virtual Threads are delivered; structured scopes are still in JDK’s preview, but with a small OSS library (Jox), you can use them now.", "And more: an alternative to reactive streams, safe cancellation, Go-like lightweight channels. Learn the basics and ask your agents to start using structured concurrency on your next task."], [["Adam Warski", "Head of R&D at SoftwareMill @ SoftwareMill", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjQ1YTlkYzdhLWRjN2YtNGY5My05YzkwLWQ3ZDIyNzljYWJmNyIsInB1ciI6ImJsb2JfaWQifX0=--8e07a959a080b2fe8c3ac7b03af9453dc6c63e96/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/adam_warski.webp", "https://www.linkedin.com/in/adamwarski/"]]],
"GROWTH|780":[["Every week brings a new framework, workflow, or buzzword promising to reinvent software development with AI agents. This talk argues the opposite: AI-driven SDLC is not a revolution. It is the moment when the practices Extreme Programming described 25 years ago finally become practical at full strength.", "XP’s ideas always sounded right but were hard to sustain: an always-engaged customer, collective code ownership, strict standards, constant review, and continuous integration. AI agents change that equation. What used to be aspirational discipline is now the very foundation that makes agentic development reliable. We will look at how familiar XP practices map onto modern AI workflows, and why some of them matter more now than ever. You’ll leave with a clear, battle-tested mental model for bringing AI into your SDLC, without chasing the next shiny methodology."], [["Mikalai Alimenkou", "Tech & AI Consultant @ XP Injection", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImE0MjY5ZjM2LWQyNmMtNGM5OS05NzFiLTkzYjE1NzUxNDBjZSIsInB1ciI6ImJsb2JfaWQifX0=--d0f9c2a4ec833022413a0014a8f4e86dbaff5603/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/alimenkou.webp", "https://www.linkedin.com/in/alimenkoumikalai/"]]],
"STUDIO|780":[["Most AI agents still wait for a prompt. The next generation runs in the background, notices what needs doing, and takes work off your plate before you ask. But always-on agents quickly get noisy, costly, and hard to trust.", "In this live session, Art Yavorskyi, Member of Technical Staff at Writer ($1.9B enterprise AI platform backed by Salesforce, Adobe, IBM, and Citi), builds an ambient agent from scratch with open-source tools. Art builds the agent infrastructure that runs in production for Salesforce, Uber, Vanguard and others.", "We’ll start with a naive agent, watch it break, and evolve it step by step into one that picks the right work, handles it well, and knows when to bring a human in. You’ll leave with a practical blueprint for delegating real work to agents."], [["Artem Yavorskyi", "Member of Technical Staff @ Writer, Creator of unbuilt.app, ex Netflix, ex Wix", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImEzMWM3NTM3LTBjYTAtNDk0Yy1iMDM5LTM5NGQ4YTdhMzg0ZiIsInB1ciI6ImJsb2JfaWQifX0=--83323e8f52258fb8473d9b1444944d476fc591fc/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/artem_yavorskiy.png", "https://www.linkedin.com/in/yvrsky/"]]],
"MAIN|810":[["AI agents are becoming both users of infrastructure and assistants for the engineers who operate it. A single prompt can trigger a burst of queries, retries, and resource requests. Meanwhile, the engineer responding to the resulting incident may delegate the investigation to another agent. What changes when agents sit on both sides of the on-call alert?", "Through personal experience, this talk dives into both sides, and discusses how, as engineers, we should change our habits, assumptions and re-learn how to design infrastructure for agents."], [["Vlad Sydorenko", "Member of Technical Staff @ OpenAI | ex-Netflix", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjllNDNkYmNjLWMyYTQtNDQzZi1iZWY1LTBiZWI4OThmOTFjYSIsInB1ciI6ImJsb2JfaWQifX0=--7d8fe36e620cf6d0fbc4fc477189fa89a819fb32/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/vlad_sydorenko.webp", "https://www.linkedin.com/in/vlad-sydorenko/"]]],
"ENGINEERING|810":[["Real-world lessons from building AmperRank - a production Flutter app, Serverpod backend, and Jaspr SSR website for EV owners - almost entirely through AI-driven agentic workflows. Learn how one developer went full-stack by building agents that learn from their own mistakes, enforce project standards, and adapt to your codebase over time."], [["Łukasz Wiśniewski", "Indie Dev @ AmperRank, Translamore", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImI2ZmNmMDNhLWQzNDEtNGQyNC1iZTI3LTg2M2FlYzAwM2UyZCIsInB1ciI6ImJsb2JfaWQifX0=--06b9e56a07e3d2d1021d9d0adef9d66930a935d8/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/liukasz_wisniewski.webp", "https://www.linkedin.com/in/lukaszwisniewski/"]]],
"MAIN|840":[["Everyone is talking about AI. And nobody knows what happens next. We're not the first generation to stand in that spot — humanity has been here every time a new engine showed up, from horses to trucks, from workshops to factories. Hopefully not the last :D", "Every time, the technology was the easy part; rebuilding everything around it was the real work. In this talk we'll walk through those earlier revolutions, find the analogies that hold (and the ones that don't), ask a few existential questions for engineers — what is a senior developer now? what are we even reviewing? Do we still need to learn how to code? And we gonna try to do predictions of what software development gonna look like in a couple of years."], [["Dima Maleev", "Director of Engineering @ Agoda", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjA4NTE4M2ViLWMwMzUtNDM2Mi1hNDIzLWE0YTE3OGE1NThkYSIsInB1ciI6ImJsb2JfaWQifX0=--883db405edf9dc66a847a0ce2ba5a40aaa124fe6/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/dima_maleev.webp", "https://www.linkedin.com/in/dmaleev/"]]],

"GROWTH|840":[["The talk explains why traditional databases such as MySQL and PostgreSQL aren't good fit for big volumes of logs. The talk sheds light on the internal architecture of the database optimized for cost-efficient storing and processing petabytes of the real production logs from applications running in Kubernetes.", "There is no magic — just simple practical architecture decisions, which allow storing a petabyte of logs in a single-node setup and scaling to hundreds of petabytes of logs in cluster setup. These architecture decisions are implemented in VictoriaLogs - a production-ready open source database for logs, which allows saving millions of euros on infrastructure and operation at a large-scale logging."], [["Aliaksandr Valialkin", "Founder and CTO @ VictoriaMetrics", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6Ijg1MjhjZGM1LWYzZDEtNDRlZS1hMjIzLTU4ZThhYjY2YjRjZiIsInB1ciI6ImJsb2JfaWQifX0=--66ea0fa356936e84fc6ea4f1119787d82236e42a/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/aliaksandr_valialkin.webp", "https://www.linkedin.com/in/valyala/"]]],
"STUDIO|840":[["DORA's 2025 report is awkward for engineering: teams completed 21% more tasks and merged 98% more PRs, while product performance rose about 2%. The missing piece is not typing speed. It is the delivery system that still throws work over the wall (idea, requirements, design, code, live) and turns every handoff into a queue. Roles stay clear; ownership of the outcome does not.", "This talk is about redesigning that system so engineers can own a problem through to production, with AI in the background rather than on the poster. At edrone, the same six people, over the same three months, went from one team shipping two features at 1x product impact to three builder pairs shipping ten features at 3x impact. You will leave with the failure modes that showed up when that model scaled (platform, discovery, and ownership after launch) and a two-person experiment a tech lead can start the following week."], [["Piotr Kacała", "Supervisory Board @ morele.net", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6Ijc2NGU3OTcwLTc5MzYtNDg3MC1iNjc3LWE1M2ViYzk1NjgwYyIsInB1ciI6ImJsb2JfaWQifX0=--7bc913be9fbe4f0313cbd6c3143ef7a093089695/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/piotr_kacala_1%201.png", "https://www.linkedin.com/in/piotr-kacala/"]]],
"GROWTH|870":[["Germany is shutting down its lignite mines, and over 9,000 jobs in Lusatia are going with them. Rather than subsidise the old industry, the government put €1.1 billion into building a new astrophysics centre there, tasked with processing the data from the Square Kilometre Array and leading the German contribution to the Einstein Telescope, two billion-euro projects that will define European science in the 2030s. This talk is about what it actually takes to convert a coal region into a technology hub, told through the technology, data, and science."], [["Pavlo Plotko", "International Scientific Affairs @ The German Centre for Astrophysics", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjY0ZjNjOGM1LWE0MTMtNDYzNy1hOWM3LTNjYjBmNTJhMmUxOSIsInB1ciI6ImJsb2JfaWQifX0=--c61b8e7dd42e02e157d08bf848260f9b17bef706/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/pavlo_plotko.webp", "https://www.linkedin.com/in/pavlo-plotko/"]]],
"STUDIO|870":[["What if you could text across the whole city with no SIM card, no carrier, and no bill?\n\nIn this hands-on workshop, you'll assemble and flash your own LoRa mesh node and take it home for free.\n\nWatch a real off-grid network form live in the room, then learn how to put your node on Poland's public mesh map.\n\nNo radio license or prior hardware experience needed.\n\nRecommended: bring a laptop with a USB-C port."], [["Yevhen Kondrashyn", "Software Engineer", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjNmZjk3ODk0LTYzZTYtNDJjOC05NTMwLTcwZjQ0NTRmNzQ3MCIsInB1ciI6ImJsb2JfaWQifX0=--184afa7987f4778c8ee2dc7696afa351874e59ac/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/yevhen_kondrashyn.webp", "https://www.linkedin.com/in/yevhen-kondrashyn"]]],
"MAIN|900":[["We used to tell computers every step. Then only the result. Now a sentence is enough, and the next systems will not wait for the sentence.", "This talk is about what software becomes after the interface: systems you talk to, systems that remember, and systems that act without being asked. We will look at what already works today, what is coming next, and what breaks along the way, with live demos throughout.", "It ends with a question for engineers: when there is nothing to click, who decides what happens?", "Art Yavorsky is a lead engineer at Writer, where he has spent two years building AI agents."], [["Artem Yavorskyi", "Member of Technical Staff @ Writer, Creator of unbuilt.app, ex Netflix, ex Wix", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImEzMWM3NTM3LTBjYTAtNDk0Yy1iMDM5LTM5NGQ4YTdhMzg0ZiIsInB1ciI6ImJsb2JfaWQifX0=--83323e8f52258fb8473d9b1444944d476fc591fc/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/artem_yavorskiy.png", "https://www.linkedin.com/in/yvrsky/"]]],
"ENGINEERING|900":[["In modern software development, the code we write no longer builds only the app’s features. More and more of it builds the machinery that writes the code for us.", "We create agents that write, test and evaluate code, traces that show why an agent did what it did, and loops that feed all of it back into the next version of the app.\n\nEvery day comes with new models, new plugins, and another repo hitting 100k stars on GitHub.", "And our daily loop has changed too. We write code that writes code even while we sleep, and we always need more: to supervise the supervisor, to challenge the orchestrator, to bring the output up to the quality of a traditional senior developer. All of it with non-deterministic tools.", "Always rushing toward more automation, we build new automations, and change the machinery while we are still building it. Look closer, and it can feel like we spend more energy on the machinery than on the apps we actually ship.", "This session is about the developer’s new life and work style, with practical examples and lessons from building that machinery every day, and how to find the right balance between logic in rule-based code and md files.", "You’ll see how to build an efficient setup, wire an evaluation loop into an AI feature, let one model grade another, catch regressions, and trace a multi-step agent run end to end.", "Expect code, diagrams, and a few things breaking on screen."], [["Lucian Gruia", "Head of Data Science & AI @ Ciklum", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImQ4ZjdkYTE0LTE3NmQtNDM1My1iMmJjLTFkMTI0MWVmYmNhNCIsInB1ciI6ImJsb2JfaWQifX0=--c39132c774c2a6d52a4d148497f1abd5b3b47ee2/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/lucian_gruia.webp", "https://www.linkedin.com/in/luciangruiaro/"]]],
"GROWTH|900":[["Your product works. Your prototype is ready. But without addressing CE compliance early, your product might never reach the market. Late compliance surprises can mean costly redesigns, missed launch dates, or even the end of your project.", "Clemens Mayer explores how integrating CE compliance into prototyping from day one helps teams uncover critical risks early, avoid expensive mistakes, and ensure their innovations are not only functional but ready for market entry."], [["Clemens Mayer", "Founder @ MAYER MAKES", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjM4NTU5YzYyLTQzN2ItNDU4YS05YTQ3LTM4ZDE0YTdiY2I1ZiIsInB1ciI6ImJsb2JfaWQifX0=--5f37d5d5b780f4b8369b996feacde93b4d954096/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/clemens_mayer.webp", "https://www.linkedin.com/in/mayermakes/"]]],

ajagojtowska/"]]],
"GROWTH|930":[["Modern enterprise platforms require users to move seamlessly across distinct operational contexts - from deep-focus workflows on the desktop to high-stakes incident response on mobile devices. How should product and engineering teams architect these ecosystems so mobile clients are not merely watered-down ports of web applications, but resilient, context-aware tools built for critical moments?\n\nIn this 25-minute talk, Kamil Brzezinski - Group Product Manager at Asana and former Product Manager for Google Cloud’s mobile experiences - shares a practical framework for building multi-surface software. Drawing on lessons from supporting cloud operators triaging infrastructure away from their desks, combined with checklist discipline and risk-mitigation models from general aviation, Kamil explores how to bridge distributed systems architecture, Critical User Journeys (CUJs), and high-stress UX design."], [["Kamil Brzezinski", "Group Product Manager @ Asana", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjllNWJiY2Y2LTM5MTItNDQxNi1hNTA2LWZkNzNjN2VlMzhhNSIsInB1ciI6ImJsb2JfaWQifX0=--27d45067f8d7105a4f6b40246b9b8645c703cef1/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/kamil.webp", "https://www.linkedin.com/in/brzezinski/"]]],
"ENGINEERING|930":[["Infrastructure engineers know exactly how to build artifacts and deploy them. However, the decisions that must change between deployments often end up in a ConfigMap and are enforced by a restart. This session proposes a more structured approach to runtime control: put each decision at the layer where it binds, and know what each layer costs to undo. Demos on Kubernetes show Argo CD and Unleash (an open-source feature management platform) working side by side, plus a real distributed system that waits for a safe moment to apply a flag, using OpenTelemetry Baggage and OpenFeature semantic conventions to keep consistency across services. Attendees leave with structured recommendations and best practices they can apply to their platform."], [["Wojtek Gawroński", "Developer Advocate @ Unleash", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6ImJjMDI0YWY2LTdhYTEtNDIzYS04ZGEyLTcwZDUxZGRlYzRhMSIsInB1ciI6ImJsb2JfaWQifX0=--fb5a4674f3e4d097c89884bf60c878e79bc7de41/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/Wojtek.png", "https://linkedin.com/in/afronski"]]],
"STUDIO|930":[["Most advice about moving from IT into defence comes from people selling you either a job or an idea. This talk comes from the hiring side.\n\nMany strong IT specialists apply to defence companies and don’t get an offer. Usually it is not about their skills: they expect defence to work like their previous company, and it doesn’t.\n\nThe talk covers what hiring managers actually look at in a CV from someone in IT, which skills carry over and which matter less, and what job posts don’t mention.\n\nCome before you decide, so you know what you are signing up for."], [["Kateryna Hirna", "Head of Recruitment and HR @ Farsight Vision", false, "https://wawtech.io/rails/active_storage/representations/proxy/eyJfcmFpbHMiOnsiZGF0YSI6IjMwNzQ4OTMwLTFkNDUtNDk1Ny05ODJmLThlOWRjYTc5MzNmMiIsInB1ciI6ImJsb2JfaWQifX0=--2e56b3e74def80b0fc4dcf4ad641fbcfbbeb8c4c/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJ3ZWJwIiwicmVzaXplX3RvX2xpbWl0IjpbODAwLDgwMF19LCJwdXIiOiJ2YXJpYXRpb24ifX0=--eb797c1dbd106a1ce375b0cc01427ab32265cbb8/hirna.webp", "https://www.linkedin.com/in/katerynahirna/"]]],
